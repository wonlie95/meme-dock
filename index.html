<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>MemeDock</title><link rel="stylesheet" href="style.css"/><style>.drag-hint{margin:-3px 0 11px;padding:7px 9px;border:1px dashed #aa83f870;border-radius:8px;background:#9a6bfa12;color:#cbb8ff;font-size:11px}.meme.can-drag{cursor:grab}.meme.dragging{opacity:.36;transform:scale(.96)}.meme.drop-target{outline:2px solid #bb91ff;outline-offset:2px;transform:translateY(-2px)}.group-row .rename-group{background:#8472ff2e;color:#d4ccff}</style></head>
<body><main class="panel"><header><div class="brand"><span class="brand-mark">✦</span><div><h1>MemeDock</h1><p>表情包快捷发送</p></div></div><div class="shortcut">Ctrl + Shift + Space</div><button class="icon-btn" id="settings" title="管理分类">⚙</button></header>
<section class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="搜索名称或标签，例如：笑" autofocus/></label><button class="add" id="import">＋ 导入表情</button></section><nav id="categories"></nav><section class="content"><div class="count" id="count"></div><div class="drag-hint" id="drag-hint" hidden>提示：按住表情缩略图并拖动，即可调整这个分组中的顺序。</div><div class="grid" id="grid"></div></section><footer><span>点击表情即可发送</span><span>图片将复制并自动粘贴到当前输入框</span></footer></main>
<dialog id="editor"><form method="dialog"><h2 id="dialog-title">编辑表情</h2><label>名称<input id="edit-name" required/></label><label>分类<select id="edit-category"></select></label><label>标签 <small>用逗号或空格分隔</small><input id="edit-tags" placeholder="例如：笑，开心，猫猫"/></label><div class="dialog-actions"><button type="button" class="danger" id="remove">删除</button><button value="cancel">取消</button><button value="save" class="primary">保存</button></div></form></dialog>
<dialog id="groups-dialog"><section class="groups-manager"><div class="manager-head"><div><h2>分组管理</h2><p>删除分组会将其中表情移到“常用”</p></div><button class="icon-btn" id="close-groups" title="关闭">×</button></div><form id="add-group"><input id="new-group-name" maxlength="60" placeholder="输入新分组名称"/><button class="primary" type="submit">新增分组</button></form><div class="group-list" id="group-list"></div></section></dialog><script src="renderer.js"></script></body></html>
